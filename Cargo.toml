[package]
name = "embedgine"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
default = ["embedded-graphics"]
alloc = []
embedded-graphics = [
  "dep:embedded-graphics",
  "embedgine-formats/embedded-graphics",
]

[dependencies]
embedded-graphics = { version = "0.8.2", optional = true }
embedgine-formats = { version = "0.1.0", path = "embedgine-formats", default-features = false }
pastey = "0.2.3"

[workspace]
resolver = "3"
members = ["demo", "embedgine-build", "embedgine-formats"]

[build-dependencies]
embedgine-build = { version = "0.1.0", path = "embedgine-build" }
embedgine-formats = { version = "0.1.0", path = "embedgine-formats" }
